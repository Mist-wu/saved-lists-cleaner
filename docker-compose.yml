services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://saved_lists:${POSTGRES_PASSWORD}@postgres:5432/saved_lists_cleaner?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saved_lists_cleaner
      POSTGRES_USER: saved_lists
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saved_lists -d saved_lists_cleaner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
